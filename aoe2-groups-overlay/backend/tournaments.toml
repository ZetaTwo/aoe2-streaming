# spec2 divisions — 8 groups per bracket arranged 4-across × 2-down:
#   row 1 (rows 4–9):   A=G:P   B=V:AE  C=AM:AV  D=BB:BK
#   row 2 (rows 23–28): E=G:P   F=V:AE  G=AM:AV  H=BB:BK
# All 8 ranges are listed for every bracket; the parser skips empty ones
# without burning a group letter, so brackets with fewer groups still
# render as Group A..N from the populated ranges.
#
# Each sheet must be shared with the runtime SA
# (terraform output -raw runtime_sa) as Viewer before /tournaments/<slug>
# returns data.

