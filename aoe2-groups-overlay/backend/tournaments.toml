# Tournament routing for the groups-overlay proxy. Baked into the Docker
# image; updating an entry requires a new image (handled by CI on push).
#
# - slug          maps to ?tournament=<slug> in the frontend URL.
# - brackets[]    matches a sheet tab; group_ranges are the A1 ranges within
#                 that tab — one entry per group. Order determines Group A,
#                 Group B, …
#
# Google Sheets document IDs live in a separate sheet-ids.toml file, mounted
# at runtime from Secret Manager (see terraform/secret.tf). Adding a new
# tournament requires both an entry here *and* a matching slug = "<sheet_id>"
# line under [sheet_ids] in that secret. The runtime service account must
# also be shared with each tournament's Google Sheet as Viewer.

[[tournaments]]
slug = "ttlc2"

[[tournaments.brackets]]
name = "Obsidian"
group_ranges = ["G4:P9", "V4:AE9"]

