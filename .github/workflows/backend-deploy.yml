name: backend deploy

on:
  push:
    branches:
      - main
    paths:
      - 'aoe2-groups-overlay/backend/**'
      - '.github/workflows/backend-deploy.yml'
  pull_request:
    paths:
      - 'aoe2-groups-overlay/backend/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/zetatwo/aoe2-groups-proxy

defaults:
  run:
    working-directory: aoe2-groups-overlay/backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: aoe2-groups-overlay/backend -> target
      - run: cargo test --locked

  lint:
    runs-on: ubuntu-latest
    # NOTE: deliberately NOT a dependency of `deploy` — fmt/clippy noise must
    # not block a fix from shipping.
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: aoe2-groups-overlay/backend -> target
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --tests -- -D warnings

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: backend-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: aoe2-groups-overlay/backend
          push: true
          # Keep a single-manifest image so `:<sha>` pinning stays simple
          # (build-push-action defaults to OCI image-index with provenance).
          provenance: false
          # Immutable per-commit tag only — GitOps wants a stable reference
          # for the infrastructure-repo commit below, so no floating :latest.
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          # The `buildcache` tag keeps the cargo-chef dependency layer across
          # CI runs; GHCR has no separate cleanup-policy exclusion like the
          # old Artifact Registry setup, so prune old buildcache manually if
          # storage ever becomes a concern.
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Check out infrastructure
        uses: actions/checkout@v6
        with:
          repository: ZetaTwo/infrastructure
          token: ${{ secrets.INFRA_REPO_PAT }}
          path: infra-repo

      - name: Bump image tag in infrastructure and push
        working-directory: infra-repo
        run: |
          sed -i "s|image: ${{ env.IMAGE_NAME }}:.*|image: ${{ env.IMAGE_NAME }}:${{ github.sha }}|" \
            k8s/aoe2-groups-overlay/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/aoe2-groups-overlay/deployment.yaml
          git commit -m "chore: bump aoe2-groups-proxy to ${{ github.sha }}"
          git push || (git pull --rebase && git push)
