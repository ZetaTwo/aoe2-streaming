name: backend deploy

on:
  push:
    branches:
      - main
    paths:
      - 'aoe2-groups-overlay/backend/**'
      - '.github/workflows/backend-deploy.yml'
  pull_request:
    paths:
      - 'aoe2-groups-overlay/backend/**'
      - '.github/workflows/backend-deploy.yml'
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/zetatwo/aoe2-groups-proxy

defaults:
  run:
    working-directory: aoe2-groups-overlay/backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: aoe2-groups-overlay/backend -> target
      - run: cargo test --locked

  lint:
    runs-on: ubuntu-latest
    # NOTE: deliberately NOT a dependency of `deploy` — fmt/clippy noise must
    # not block a fix from shipping.
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: aoe2-groups-overlay/backend -> target
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --tests -- -D warnings

  # Deploys every push to main to staging (aoe2-groups.zetatwo.dev, behind
  # the cluster's GitHub OAuth gate). Production only updates when a
  # release is published — see deploy-production below.
  deploy-staging:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: backend-deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: aoe2-groups-overlay/backend
          push: true
          # Keep a single-manifest image so `:<sha>` pinning stays simple
          # (build-push-action defaults to OCI image-index with provenance).
          provenance: false
          # Immutable per-commit tag only — deploy-production promotes this
          # exact tag by digest, so no floating :latest.
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          # The `buildcache` tag keeps the cargo-chef dependency layer across
          # CI runs; GHCR has no separate cleanup-policy exclusion like the
          # old Artifact Registry setup, so prune old buildcache manually if
          # storage ever becomes a concern.
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Check out infrastructure
        uses: actions/checkout@v6
        with:
          repository: ZetaTwo/infrastructure
          token: ${{ secrets.INFRA_REPO_PAT }}
          path: infra-repo

      - name: Bump staging image tag in infrastructure and push
        working-directory: infra-repo
        run: |
          sed -i "s|newTag: .*|newTag: ${{ github.sha }}|" \
            k8s/aoe2-groups-proxy/overlays/staging/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/aoe2-groups-proxy/overlays/staging/kustomization.yaml
          git commit -m "chore: bump aoe2-groups-proxy staging to ${{ github.sha }}"
          git push || (git pull --rebase && git push)

  # Promotes the exact image already built+pushed by deploy-staging for the
  # release's commit — retags it, never rebuilds, so what ships to
  # production is bit-identical to what was tested in staging.
  deploy-production:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: backend-deploy-production
      cancel-in-progress: false
    steps:
      - name: Check out the released commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Resolve release commit SHA
        id: release_sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the released commit has a tested staging image
        run: |
          docker buildx imagetools inspect \
            "${{ env.IMAGE_NAME }}:${{ steps.release_sha.outputs.sha }}" \
            || { echo "::error::No image tagged :${{ steps.release_sha.outputs.sha }} in GHCR — this release's commit was never built+pushed by deploy-staging. Refusing to promote an untested artifact; tag the release from a commit that's actually on main." >&2; exit 1; }

      - name: Promote the tested image to the release tag (retag, no rebuild)
        run: |
          docker buildx imagetools create \
            --tag "${{ env.IMAGE_NAME }}:${{ github.event.release.tag_name }}" \
            "${{ env.IMAGE_NAME }}:${{ steps.release_sha.outputs.sha }}"

      - name: Check out infrastructure
        uses: actions/checkout@v6
        with:
          repository: ZetaTwo/infrastructure
          token: ${{ secrets.INFRA_REPO_PAT }}
          path: infra-repo

      - name: Bump production image tag in infrastructure and push
        working-directory: infra-repo
        run: |
          sed -i "s|newTag: .*|newTag: ${{ github.event.release.tag_name }}|" \
            k8s/aoe2-groups-proxy/overlays/production/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/aoe2-groups-proxy/overlays/production/kustomization.yaml
          git commit -m "chore: promote aoe2-groups-proxy to ${{ github.event.release.tag_name }} (production)"
          git push || (git pull --rebase && git push)
