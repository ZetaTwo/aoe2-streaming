name: backend deploy

on:
  push:
    branches:
      - main
    paths:
      - 'aoe2-groups-overlay/backend/**'
      - '.github/workflows/backend-deploy.yml'
  pull_request:
    paths:
      - 'aoe2-groups-overlay/backend/**'
      - '.github/workflows/backend-deploy.yml'
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/zetatwo/aoe2-groups-proxy

defaults:
  run:
    working-directory: aoe2-groups-overlay/backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: aoe2-groups-overlay/backend -> target
      - run: cargo test --locked

  lint:
    runs-on: ubuntu-latest
    # NOTE: deliberately NOT a dependency of `deploy` — fmt/clippy noise must
    # not block a fix from shipping.
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: aoe2-groups-overlay/backend -> target
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --tests -- -D warnings

  # Deploys every push to main to staging (aoe2-groups.zetatwo.dev, behind
  # the cluster's login gate). Production only updates when a release is
  # published — see deploy-production below. Both only push images and then
  # trigger ZetaTwo/infrastructure's deploy workflow, which picks the tags.
  deploy-staging:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: backend-deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      # Commit time, not build time: re-running CI for an old commit must
      # not make it the newest main-* tag.
      - name: Resolve commit timestamp
        id: commit
        run: echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: aoe2-groups-overlay/backend
          push: true
          # Keep a single-manifest image so `:<sha>` pinning stays simple
          # (build-push-action defaults to OCI image-index with provenance).
          provenance: false
          # Immutable per-commit tags only, no floating :latest.
          # deploy-production promotes :<sha> by digest; the infra deploy
          # workflow pins staging to the newest main-<epoch>-<sha>.
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:main-${{ steps.commit.outputs.epoch }}-${{ github.sha }}
          # The `buildcache` tag keeps the cargo-chef dependency layer across
          # CI runs; GHCR has no separate cleanup-policy exclusion like the
          # old Artifact Registry setup, so prune old buildcache manually if
          # storage ever becomes a concern.
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Trigger infrastructure deploy
        uses: ZetaTwo/infrastructure/.github/actions/trigger-deploy@main
        with:
          client-id: ${{ secrets.DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}

  # Promotes the exact image already built+pushed by deploy-staging for the
  # release's commit — retags it, never rebuilds, so what ships to
  # production is bit-identical to what was tested in staging.
  deploy-production:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: backend-deploy-production
      cancel-in-progress: false
    steps:
      - name: Check out the released commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Resolve release commit SHA
        id: release_sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the released commit has a tested staging image
        run: |
          docker buildx imagetools inspect \
            "${{ env.IMAGE_NAME }}:${{ steps.release_sha.outputs.sha }}" \
            || { echo "::error::No image tagged :${{ steps.release_sha.outputs.sha }} in GHCR — this release's commit was never built+pushed by deploy-staging. Refusing to promote an untested artifact; tag the release from a commit that's actually on main." >&2; exit 1; }

      - name: Promote the tested image to the release tag (retag, no rebuild)
        run: |
          docker buildx imagetools create \
            --tag "${{ env.IMAGE_NAME }}:${{ github.event.release.tag_name }}" \
            "${{ env.IMAGE_NAME }}:${{ steps.release_sha.outputs.sha }}"

      - name: Trigger infrastructure deploy
        uses: ZetaTwo/infrastructure/.github/actions/trigger-deploy@main
        with:
          client-id: ${{ secrets.DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
